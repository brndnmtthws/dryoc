
[package]
name = "dryoc-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Independent oracles for the differential targets. `sha2`, `curve25519-dalek`
# and `zeroize` are dryoc dependencies and `chacha20` and `salsa20` are
# dev-dependencies; `sha3` 0.10 (its own sponge over `keccak` 0.1, and the last
# release with SHAKE and TurboSHAKE) checks dryoc's Keccak sponge. `zeroize`
# only supplies the trait `fuzz-protected` needs to call `Zeroize::zeroize` on
# protected values. `ml-kem` 0.3 (RustCrypto's FIPS 203 implementation, with
# its own NTT, sampling, compression and encodings; `hazmat` documents the
# deterministic encapsulation) is the ML-KEM-768 oracle for `fuzz-kem`, which
# builds X-Wing from the draft on top of it, dalek and `sha3` 0.10.
chacha20 = { version = "0.10", features = ["xchacha"] }
curve25519-dalek = "5.0"
ml-kem = { version = "0.3", default-features = false, features = ["hazmat"] }
salsa20 = "0.11"
sha2 = "0.11"
sha3 = "0.10"
zeroize = "1.9"

[dependencies.dryoc]
path = ".."

[features]
# `dryoc/base64` is on by default in the library; mirror that so
# `fuzz-pwhash-str` fuzzes the encoded-string parsers without `--features`.
default = ["base64"]
base64 = ["dryoc/base64"]
nightly = ["dryoc/nightly"]
simd_backend = ["dryoc/simd_backend"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz-secretstream-pull"
path = "fuzz_targets/fuzz-secretstream-pull.rs"
test = false
doc = false

[[bin]]
name = "fuzz-pwhash-str"
path = "fuzz_targets/fuzz-pwhash-str.rs"
test = false
doc = false

[[bin]]
name = "fuzz-from-bytes"
path = "fuzz_targets/fuzz-from-bytes.rs"
test = false
doc = false

[[bin]]
name = "fuzz-protected"
path = "fuzz_targets/fuzz-protected.rs"
test = false
doc = false

[[bin]]
name = "fuzz-aead"
path = "fuzz_targets/fuzz-aead.rs"
test = false
doc = false

[[bin]]
name = "fuzz-stream-ciphers"
path = "fuzz_targets/fuzz-stream-ciphers.rs"
test = false
doc = false

[[bin]]
name = "fuzz-hashes"
path = "fuzz_targets/fuzz-hashes.rs"
test = false
doc = false

[[bin]]
name = "fuzz-curve25519"
path = "fuzz_targets/fuzz-curve25519.rs"
test = false
doc = false

[[bin]]
name = "fuzz-kem"
path = "fuzz_targets/fuzz-kem.rs"
test = false
doc = false
