
[package]
name = "dryoc-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Independent oracles for the differential targets; all already in the dryoc
# dependency graph (`sha2` and `curve25519-dalek` as dependencies, `chacha20`
# and `salsa20` as dev-dependencies).
chacha20 = { version = "0.10", features = ["xchacha"] }
curve25519-dalek = "4.1.3"
salsa20 = "0.11"
sha2 = "0.11"

[dependencies.dryoc]
path = ".."

[features]
# `dryoc/base64` is on by default in the library; mirror that so
# `fuzz_pwhash_str` fuzzes the encoded-string parsers without `--features`.
default = ["base64"]
base64 = ["dryoc/base64"]
nightly = ["dryoc/nightly"]
simd_backend = ["dryoc/simd_backend"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false

[[bin]]
name = "fuzz_secretstream_pull"
path = "fuzz_targets/fuzz_secretstream_pull.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pwhash_str"
path = "fuzz_targets/fuzz_pwhash_str.rs"
test = false
doc = false

[[bin]]
name = "fuzz_from_bytes"
path = "fuzz_targets/fuzz_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_protected"
path = "fuzz_targets/fuzz_protected.rs"
test = false
doc = false
[[bin]]
name = "fuzz_aead"
path = "fuzz_targets/fuzz_aead.rs"
test = false
doc = false

[[bin]]
name = "fuzz_stream_ciphers"
path = "fuzz_targets/fuzz_stream_ciphers.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hashes"
path = "fuzz_targets/fuzz_hashes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_curve25519"
path = "fuzz_targets/fuzz_curve25519.rs"
test = false
doc = false
