name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: semver
      - name: Install cargo-semver-checks
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-semver-checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx semver-checks --verbose

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Install cargo-deny
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: cargo-deny
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo deny --all-features check advisories

  wasm:
    name: wasm32-unknown-unknown / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable code only.
          - name: baseline
            rustflags: ""
          # WebAssembly has no runtime feature detection, so the simd128
          # kernels are compiled in only when the target feature is enabled.
          - name: simd128
            rustflags: -Ctarget-feature=+simd128
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain with wasm32 target
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: wasm-${{ matrix.name }}
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: |
          version="$(
            cargo tree --target wasm32-unknown-unknown --no-default-features --features std,serde,base64,wincode_0_6 \
              | sed -n 's/.*wasm-bindgen v\([0-9.]*\).*/\1/p' \
              | head -n 1
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Prebuilt release binaries; `cargo install` spent ~1m40s compiling.
      - name: Install matching wasm-bindgen test runner
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # RUSTFLAGS only on the wasm32 steps: with `--target` it applies to the
      # wasm32 artifacts and not to host build scripts or installed tools.
      # The simd128 kernels do not depend on `std`, so the `no_std` builds
      # (with and without `alloc`) are tested too.
      #
      # `cargo test --tests` rather than nextest: nextest starts one
      # wasm-bindgen-test-runner (wasm-bindgen pass plus Node) per test, which
      # cost 2-7s each and dominated the job; `cargo test` starts one per
      # binary. `--tests` keeps nextest's target set (no doctests). opt-level
      # 1 keeps debug assertions and overflow checks but cuts the ML-KEM
      # accumulated-vector test from ~60s; dropping debuginfo shrinks the wasm
      # the runner processes.
      - run: |
          for features in "" alloc std,serde,base64,wincode_0_6; do
            mbx test --target wasm32-unknown-unknown --tests --no-default-features --features "$features"
          done
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG: "0"
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: |
          for features in "" alloc std,serde,base64,wincode_0_6; do
            mbx clippy --target wasm32-unknown-unknown --all-targets --no-default-features --features "$features" -- -D warnings
          done
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  platform:
    name: ${{ matrix.os }} / ${{ matrix.rust }} / ${{ matrix.features }}
    strategy:
      matrix:
        rust:
          - stable
          # - beta
          - nightly
        features:
          - default
          - simd_backend
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - rust: stable
            features: simd_backend
          - os: windows-latest
            features: simd_backend
    runs-on: ${{ matrix.os }}
    env:
      FEATURES: ${{ matrix.rust != 'nightly' && matrix.features || format('{0},nightly', matrix.features) }}
      # mbx 1.12.0's build-script launcher is not found by nightly Cargo's new
      # build-dir layout on Windows (it runs `.../out/build_script_build`, which
      # then falls through to the mbx CLI); keep the rest of mbx enabled there.
      MBX_BUILD_SCRIPT_EXECUTION: ${{ startsWith(matrix.os, 'windows') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup ${{ matrix.rust }} Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          components: clippy rustfmt
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: platform-${{ matrix.features }}
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx build --features ${{ env.FEATURES }}
      - run: mbx nextest run --features ${{ env.FEATURES }}
        env:
          RUST_BACKTRACE: 1
      - run: cargo fmt --all -- --check
        if: ${{ matrix.rust == 'nightly' && matrix.os == 'ubuntu-latest' && matrix.features == 'default' }}
      - run: mbx clippy --features ${{ env.FEATURES }} -- -D warnings

  feature-matrix:
    name: features / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # `--no-default-features` alone is `no_std` without `alloc`.
          - name: no-std
            flags: --no-default-features
          - name: alloc-only
            flags: --no-default-features --features alloc
          - name: serde-no-alloc
            flags: --no-default-features --features serde
          - name: alloc-optional-features
            flags: --no-default-features --features serde,base64,wincode_0_6
          - name: std-only
            flags: --no-default-features --features std
          - name: base64-only
            flags: --no-default-features --features std,base64
          - name: serde-only
            flags: --no-default-features --features std,serde
          - name: wincode_0_6-only
            flags: --no-default-features --features std,wincode_0_6
          - name: optional-features
            flags: --no-default-features --features std,serde,base64,wincode_0_6
          - name: protected-only
            flags: --no-default-features --features protected
          - name: serde-protected
            flags: --no-default-features --features serde,protected
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: features-${{ matrix.name }}
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets ${{ matrix.flags }}
        env:
          RUST_BACKTRACE: 1
      - run: mbx clippy --all-targets ${{ matrix.flags }} -- -D warnings

  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSRV toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: 1.89.0
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: msrv
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets --features serde,wincode_0_6
      - run: mbx check --no-default-features
      - run: mbx check --no-default-features --features alloc

  all-features:
    name: all features / nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
          components: clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: all-features
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets --all-features
        env:
          RUST_BACKTRACE: 1
      - run: mbx clippy --all-targets --all-features -- -D warnings
      # `nightly` does not imply `std`: the portable SIMD backends in `no_std`.
      - run: mbx nextest run --all-targets --no-default-features --features simd_backend,nightly
        env:
          RUST_BACKTRACE: 1
      - run: mbx clippy --all-targets --no-default-features --features simd_backend,nightly -- -D warnings

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: docs
      - run: mbx test --doc --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: mbx doc --features nightly,serde,base64,wincode_0_6 --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: mbx doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  no-std:
    name: no_std / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - aarch64-unknown-none
    env:
      # Bare-metal targets have no system entropy source; applications supply
      # a getrandom custom backend, and a library build needs only the cfg.
      RUSTFLAGS: --cfg getrandom_backend="custom"
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain with ${{ matrix.target }}
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy
          targets: ${{ matrix.target }}
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: no-std-${{ matrix.target }}
      - run: mbx build --target ${{ matrix.target }} --no-default-features
      - run: mbx build --target ${{ matrix.target }} --no-default-features --features alloc
      - run: mbx clippy --target ${{ matrix.target }} --no-default-features --features alloc -- -D warnings

  # Without `std`, CPU-specific kernels are chosen from the compile-time target
  # features; this runs the suite through the AVX2 and BMI2 kernels that way.
  no-std-target-features:
    name: no_std / x86-64 AVX2 and BMI2 target features
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Ctarget-feature=+avx2,+bmi2
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: no-std-target-features
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets --no-default-features
        env:
          RUST_BACKTRACE: 1
      - run: mbx nextest run --all-targets --no-default-features --features alloc
        env:
          RUST_BACKTRACE: 1

  miri:
    name: Miri / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portable and serialization
            profile: miri-smoke
            rustflags: ""
          - name: AVX2 and BMI2 kernels
            profile: miri-kernels
            rustflags: -Ctarget-feature=+avx2,+bmi2
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain with Miri
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
          components: miri rust-src
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Miri cannot be wrapped by mbx. It builds its own interpreted sysroot.
      - run: cargo +nightly miri setup --target x86_64-unknown-linux-gnu
      # Miri cannot enforce protected-memory page permissions or call
      # libsodium. The native jobs above retain that coverage.
      - name: Run focused safety checks under Miri
        run: >-
          cargo +nightly miri nextest run
          --target x86_64-unknown-linux-gnu
          --no-default-features --features std,serde,base64,wincode_0_6
          --profile ${{ matrix.profile }}
          --test-threads 4

  fuzz:
    name: fuzz targets build & smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
      - name: Install cargo-fuzz
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: cargo-fuzz
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build fuzz targets for the Rust host
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fuzz build --target "$HOST_TARGET" --features base64
      # A smoke test, not a fuzzing campaign: each target starts from an empty
      # corpus (plus the checked-in boundary-length seeds where a target has
      # them) and runs for a fixed wall time. `-max_total_time` does not
      # interrupt a stuck input, so `-timeout` bounds that too; every
      # legitimate input takes well under a second.
      - name: Run each fuzz target for 10 seconds
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          for target in $(cargo fuzz list); do
            corpora=("fuzz/corpus/$target")
            mkdir -p "${corpora[0]}"
            if [ -d "fuzz/seeds/$target" ]; then
              corpora+=("fuzz/seeds/$target")
            fi
            cargo fuzz run --target "$HOST_TARGET" --features base64 "$target" "${corpora[@]}" \
              -- -max_total_time=10 -timeout=10
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  python:
    name: Python / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      # Never fall back to a runner's system Python: "3" means the latest
      # stable uv-managed CPython.
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3"
        include:
          - os: ubuntu-latest
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: python
      - name: Install Python
        id: python
        run: |
          uv python install
          echo "path=$(uv python find)" >> "$GITHUB_OUTPUT"
        working-directory: python
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          manylinux: ${{ matrix.python-version == '3.14t' && 'off' || '' }}
          args: --release --locked --out dist ${{ matrix.python-version == '3.14t' && format('-i {0}', steps.python.outputs.path) || '' }}
          working-directory: python
      - name: Install test dependencies
        run: uv sync --locked --only-group test
        working-directory: python
      - name: Install built wheel
        run: uv pip install dist/*.whl
        working-directory: python
      - name: Verify imports use installed wheel
        run: uv run --no-sync python -c "import dryoc, sys; assert 'site-packages' in dryoc.__file__, dryoc.__file__"
        working-directory: python
      - name: Verify interoperability dependency is installed
        run: uv run --no-sync python -c "import nacl"
        working-directory: python
      - name: Run Python tests
        run: uv run --no-sync pytest -p no:cacheprovider tests
        working-directory: python
      - name: Setup nightly Rust validation tools
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3'
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
          components: clippy rustfmt
      - name: Lint Python and Rust code
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3'
        run: |
          uv run --no-sync python -m mypy.stubtest dryoc
          uv run --no-sync mypy --strict python/dryoc tests
          uv run --no-sync pyright --verifytypes dryoc --ignoreexternal
          cargo clippy --locked --all-targets -- -D warnings
          cargo +nightly fmt --check
        working-directory: python

  python-sdist:
    name: Python / source distribution round trip
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          working-directory: python
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - name: Build wheel from source distribution
        run: |
          mkdir extracted
          tar -xzf python/dist/*.tar.gz -C extracted
          mv extracted/dryoc-* extracted/sdist
          cd extracted/sdist
          uvx --from 'maturin>=1.15,<2' maturin build --release --locked --out "$GITHUB_WORKSPACE/python/dist"
      # The source distribution carries no uv.lock, so this resolves the test
      # group afresh, as a downstream build would.
      - name: Install test dependencies from extracted project
        run: uv sync --only-group test
        working-directory: extracted/sdist
      - name: Install built wheel
        run: uv pip install "$GITHUB_WORKSPACE"/python/dist/*.whl
        working-directory: extracted/sdist
      - name: Verify wheel imports and interop dependency
        run: |
          uv run --no-sync python -c "import dryoc, sys; assert 'site-packages' in dryoc.__file__, dryoc.__file__"
          uv run --no-sync python -c "import nacl"
        working-directory: extracted/sdist
      - name: Run tests from extracted source distribution
        run: uv run --no-sync pytest -p no:cacheprovider tests
        working-directory: extracted/sdist/python

  # Single job for branch protection to require. `always()` matters: without
  # it a failed upstream job skips this one, and GitHub treats a skipped
  # required check as passing.
  all-jobs-pass:
    name: all jobs pass
    if: always()
    needs:
      - semver
      - audit
      - wasm
      - platform
      - feature-matrix
      - no-std
      - no-std-target-features
      - msrv
      - all-features
      - docs
      - miri
      - fuzz
      - python
      - python-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
