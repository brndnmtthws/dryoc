name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: semver
      - name: Install cargo-semver-checks
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-semver-checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx semver-checks --verbose

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Install cargo-deny
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: cargo-deny
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo deny --all-features check advisories

  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain with wasm32 target
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
          targets: wasm32-unknown-unknown
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: wasm
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install matching wasm-bindgen test runner
        run: |
          WASM_BINDGEN_VERSION="$(
            cargo tree --target wasm32-unknown-unknown --no-default-features --features serde,base64,wincode \
              | sed -n 's/.*wasm-bindgen v\([0-9.]*\).*/\1/p' \
              | head -n 1
          )"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: mbx nextest run --target wasm32-unknown-unknown --no-default-features --features serde,base64,wincode
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  platform:
    name: ${{ matrix.os }} / ${{ matrix.rust }} / ${{ matrix.features }}
    strategy:
      matrix:
        rust:
          - stable
          # - beta
          - nightly
        features:
          - default
          - serde
          - simd_backend
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - rust: stable
            features: simd_backend
          - os: windows-latest
            features: simd_backend
    runs-on: ${{ matrix.os }}
    env:
      FEATURES: ${{ matrix.rust != 'nightly' && matrix.features || format('{0},nightly', matrix.features) }}
      # mbx 1.12.0's build-script launcher is not found by nightly Cargo's new
      # build-dir layout on Windows (it runs `.../out/build_script_build`, which
      # then falls through to the mbx CLI); keep the rest of mbx enabled there.
      MBX_BUILD_SCRIPT_EXECUTION: ${{ startsWith(matrix.os, 'windows') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup ${{ matrix.rust }} Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          components: clippy rustfmt
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: platform-${{ matrix.features }}
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx build --features ${{ env.FEATURES }}
      - run: mbx nextest run --features ${{ env.FEATURES }}
        env:
          RUST_BACKTRACE: 1
      - run: cargo fmt --all -- --check
        if: ${{ matrix.rust == 'nightly' && matrix.os == 'ubuntu-latest' && matrix.features == 'default' }}
      - run: mbx clippy --features ${{ env.FEATURES }} -- -D warnings

  feature-matrix:
    name: features / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: minimal
            flags: --no-default-features
          - name: base64-only
            flags: --no-default-features --features base64
          - name: serde-only
            flags: --no-default-features --features serde
          - name: wincode-only
            flags: --no-default-features --features wincode
          - name: optional-features
            flags: --no-default-features --features serde,base64,wincode
          - name: protected-only
            flags: --no-default-features --features protected
          - name: serde-protected
            flags: --no-default-features --features serde,protected
    steps:
      - uses: actions/checkout@v7
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: features-${{ matrix.name }}
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets ${{ matrix.flags }}
        env:
          RUST_BACKTRACE: 1
      - run: mbx clippy --all-targets ${{ matrix.flags }} -- -D warnings

  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSRV toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: 1.89.0
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: msrv
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets --features serde,wincode

  all-features:
    name: all features / nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
          components: clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: all-features
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mbx nextest run --all-targets --all-features
        env:
          RUST_BACKTRACE: 1
      - run: mbx clippy --all-targets --all-features -- -D warnings

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: docs
      - run: mbx test --doc --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: mbx doc --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: mbx doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: Miri / ${{ matrix.features.name }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: minimal
            flags: ""
          - name: optional-features
            flags: --features serde,base64,wincode
        shard: [1, 2, 3, 4]
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain with Miri
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
          components: miri rust-src
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Miri cannot be wrapped by mbx. It builds its own interpreted sysroot.
      - run: cargo +nightly miri setup --target x86_64-unknown-linux-gnu
      # Miri cannot enforce protected-memory page permissions or call
      # libsodium. The native jobs above retain that coverage.
      - name: Run tests under Miri
        run: >-
          cargo +nightly miri nextest run
          --target x86_64-unknown-linux-gnu
          --no-default-features ${{ matrix.features.flags }}
          --partition hash:${{ matrix.shard }}/4
      # Miri's baseline x86-64 CPU has no AVX2. Enable it explicitly for
      # the load/store kernels so their unsafe memory accesses are checked.
      - name: Check AVX2 kernels under Miri
        if: matrix.features.name == 'optional-features' && matrix.shard == 1
        env:
          RUSTFLAGS: -Ctarget-feature=+avx2,+bmi2
        run: >-
          cargo +nightly miri nextest run
          --target x86_64-unknown-linux-gnu
          --no-default-features --features serde,base64,wincode --lib
          -E 'test(=poly1305::poly1305_soft::tests::avx2_blocks_match_scalar)
          | test(=blake2b::blake2b_soft::tests::test_x86_64_compress_matches_portable)
          | test(=argon2::tests::test_fill_block_x86_64_matches_soft)
          | test(=chacha20::tests::vector_path::test_kernel_chunk_matches_scalar_blocks)
          | test(=salsa20::tests::vector_path::test_kernel_chunk_matches_scalar_blocks)
          | test(=scalarmult_curve25519::tests::test_rfc7748_vectors)'

  fuzz:
    name: fuzz targets build & smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
      - name: Install cargo-fuzz
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: cargo-fuzz
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build fuzz targets for the Rust host
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fuzz build --target "$HOST_TARGET" --features base64
      # A smoke test, not a fuzzing campaign: each target starts from an empty
      # corpus (plus the checked-in boundary-length seeds where a target has
      # them) and runs for a fixed wall time. `-max_total_time` does not
      # interrupt a stuck input, so `-timeout` bounds that too; every
      # legitimate input takes well under a second.
      - name: Run each fuzz target for 10 seconds
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          for target in $(cargo fuzz list); do
            corpora=("fuzz/corpus/$target")
            mkdir -p "${corpora[0]}"
            if [ -d "fuzz/seeds/$target" ]; then
              corpora+=("fuzz/seeds/$target")
            fi
            cargo fuzz run --target "$HOST_TARGET" --features base64 "$target" "${corpora[@]}" \
              -- -max_total_time=10 -timeout=10
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Single job for branch protection to require. `always()` matters: without
  # it a failed upstream job skips this one, and GitHub treats a skipped
  # required check as passing.
  all-jobs-pass:
    name: all jobs pass
    if: always()
    needs:
      - semver
      - audit
      - wasm
      - platform
      - feature-matrix
      - msrv
      - all-features
      - docs
      - miri
      - fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
