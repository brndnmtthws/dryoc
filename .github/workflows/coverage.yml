name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@v1
        with:
          toolchain: nightly
          profile: minimal
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: coverage
      - name: Install cargo-tarpaulin
        uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: cargo-tarpaulin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Under ptrace the compute-heavy tests go 40-50s without an event; the
      # default 60s watchdog is too close to that and has timed out.
      - run: mbx tarpaulin --timeout 300 --features serde,nightly,wincode_0_6 --out Xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: github.repository == 'brndnmtthws/dryoc'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
