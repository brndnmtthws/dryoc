name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup nightly Rust toolchain
        uses: brndnmtthws/rust-action-rustup@913349b802fe843511093e8c2014c94d8168c6b6 # v1.2.0
        with:
          toolchain: nightly
          profile: minimal
      - uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          cache-generation: coverage
          version: 1.12.0
      - name: Install cargo-tarpaulin
        uses: brndnmtthws/rust-action-cargo-binstall@2c46d38e56ef5653e953c62f9fce2125d568a15c # v1
        with:
          packages: cargo-tarpaulin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Under ptrace the compute-heavy tests go 40-50s without an event; the
      # default 60s watchdog is too close to that and has timed out.
      - run: mbx tarpaulin --timeout 300 --features serde,nightly,wincode --out Xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: github.repository == 'brndnmtthws/dryoc'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
