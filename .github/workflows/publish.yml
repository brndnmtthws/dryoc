name: Publish to crates.io

on:
  push:
    tags:
      - v*
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  discussions: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup stable Rust toolchain
        uses: brndnmtthws/rust-action-rustup@913349b802fe843511093e8c2014c94d8168c6b6 # v1.2.0
        with:
          toolchain: stable
          profile: minimal
          components: clippy
      # Tag pushes never save a cache, so restore the archive that the
      # `features / optional-features` job saves on main.
      - uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          cache-generation: features-optional-features
          version: 1.12.0
      - name: Install cargo-nextest
        uses: brndnmtthws/rust-action-cargo-binstall@2c46d38e56ef5653e953c62f9fce2125d568a15c # v1
        with:
          packages: --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify tag matches crate version
        shell: bash
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_NAME}" != "v${CRATE_VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}" >&2
            exit 1
          fi
      - run: mbx nextest run --all-targets
      - run: mbx nextest run --all-targets --no-default-features
      - run: mbx nextest run --all-targets --no-default-features --features serde,base64,wincode
      - run: mbx nextest run --all-targets --no-default-features --features serde,protected
      - run: mbx test --doc
      - run: mbx doc --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: mbx clippy --all-targets --features serde,base64,wincode -- -D warnings
      - name: Install nightly validation toolchain
        run: rustup toolchain install nightly --profile minimal --component clippy
      - run: mbx +nightly nextest run --all-targets --all-features
      - run: mbx +nightly test --doc --all-features
      - run: mbx +nightly clippy --all-targets --all-features -- -D warnings
      - run: cargo package
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          discussion_category_name: General
          generate_release_notes: true
