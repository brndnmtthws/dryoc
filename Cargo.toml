[package]
authors = ["Brenden Matthews <brenden@brndn.io>"]
categories = ["cryptography", "algorithms"]
description = "Don't Roll Your Own Crypto: pure-Rust, hard to misuse cryptography library"
documentation = "https://docs.rs/dryoc"
edition = "2024"
keywords = ["cryptography", "nacl", "libsodium", "curve25519", "crypto_box"]
license = "MIT"
name = "dryoc"
repository = "https://github.com/brndnmtthws/dryoc"
rust-version = "1.89"
version = "2.0.0"

[dependencies]
curve25519-dalek = { version = "5.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
keccak = { version = "0.2", features = ["parallel"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false, features = ["i128"] }
wincode = { version = "0.6", optional = true, default-features = false, features = ["derive"] }
zeroize = { version = "1.9", default-features = false, features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "impl-default",
  "memoryapi",
  "minwindef",
  "std",
  "sysinfoapi",
  "winnt",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
base64 = "0.23"
curve25519-dalek = { version = "5.0", default-features = false, features = ["precomputed-tables"] }
chacha20 = { version = "0.10", features = ["legacy", "zeroize"] }
hex = "0.4"
libc = "0.2"
num-bigint = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
salsa20 = { version = "0.11", features = ["zeroize"] }
static_assertions = "1.1"
wincode = "0.6"

[[test]]
name = "integration_tests"
required-features = ["alloc"]

[[test]]
name = "wasm_tests"
required-features = ["alloc"]

[target.'cfg(not(any(miri, all(target_arch = "wasm32", target_os = "unknown"))))'.dev-dependencies]
libsodium-sys-stable = "1.24"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
proptest = "1"

[features]
base64 = ["alloc"]
default = ["base64", "protected", "std"]
nightly = ["protected"]
protected = ["std"]
simd_backend = []
alloc = ["serde?/alloc", "wincode?/alloc", "zeroize/alloc"]
std = ["alloc", "serde?/std", "wincode?/std"]
wincode_0_6 = ["alloc", "dep:wincode"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(dryoc_native_tests)",
  "cfg(dryoc_stream_kernel)",
  "cfg(tarpaulin)",
] }

[package.metadata.docs.rs]
# docs.rs uses nightly, enable feature flag to get all the juicy docs
features = ["nightly", "serde", "base64", "wincode_0_6"]
